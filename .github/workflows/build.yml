name: Build RENK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Put the offline research pack inside the app (if one has been built)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download offline-pack -p offline-pack.zip -D app/src/main/assets --clobber; then
            sha1sum app/src/main/assets/offline-pack.zip | cut -c1-12 > app/src/main/assets/offline-pack.version
            ls -lh app/src/main/assets/offline-pack.zip
          else
            echo "No offline pack yet. Run the 'Build offline research pack' workflow to add one."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: renk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
